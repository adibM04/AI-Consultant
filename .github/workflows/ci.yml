name: ci

# One job definition, three operating systems. Contributors work on macOS and Windows
# too, so a check that only passes on a UTF-8 Linux runner is a portability bug.
# scripts/dev.py is the single entry point: it runs the same commands locally.
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the checklist-authoring dependency
        run: python -m pip install pyyaml
      - name: Run every check
        run: python scripts/dev.py check
