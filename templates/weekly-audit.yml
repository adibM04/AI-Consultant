# Copy to .github/workflows/weekly-audit.yml in YOUR project.
#
# A full model-driven audit on a schedule. This DOES need an Anthropic API key and costs money
# (a five-domain audit of a tiny project cost about $0.70 in our tests; a real project and all
# 14 domains will cost more). Use a DEDICATED key with a low spend limit: the model has shell
# access on the runner and the key is in its process environment, so a repository that manipulates
# the auditor could try to exfiltrate it. Only run this on repositories whose contents you trust.
#
# Safety rules baked in, please keep them:
#   * schedule + manual trigger only. NEVER run this on pull_request or pull_request_target:
#     a pull request is untrusted text and the auditor reads files with shell access.
#   * read-only token. The audit writes only inside .consultant/ on the runner.
#   * the plugin is moved OUT of the workspace before the audit, so the auditors do not read or
#     scan its own fixtures (which contain fake secrets and prompt-injection text on purpose).
#   * a hard spending cap on every run (--max-budget-usd).
#
# Prerequisites: add a repository secret ANTHROPIC_API_KEY, run /ai-consultant:consult once locally
# and commit .consultant/profile.json so this job runs non-interactively with your answers.
#
# Try it first with a manual run limited to a couple of domains and a small budget.
name: AI-Consultant weekly audit
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      domains:
        description: "Comma-separated domains, for example identity,security (default: all)"
        required: false
        default: ""
      max-budget-usd:
        description: "Hard spending cap for this run, in USD"
        required: false
        default: "15"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: adibM04/AI-Consultant
          ref: 80ab978c2e5897de6b3ae248d4f5b14a4ecf8436   # release v0.2.0, pinned by commit SHA
          path: .ai-consultant
      - name: Move the plugin out of the audited workspace
        run: |
          mv .ai-consultant "$RUNNER_TEMP/ai-consultant"
          rm -rf "$RUNNER_TEMP/ai-consultant/.git"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Require a committed profile
        run: test -f .consultant/profile.json || { echo "::error::Run /ai-consultant:consult locally and commit .consultant/profile.json first"; exit 1; }
      - name: Require the API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: test -n "$ANTHROPIC_API_KEY" || { echo "::error::Add a repository secret named ANTHROPIC_API_KEY (Settings, Secrets and variables, Actions). Use a dedicated key with a low spend limit."; exit 1; }
      - name: Run the audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_DOMAINS: ${{ github.event.inputs.domains }}
          INPUT_BUDGET: ${{ github.event.inputs.max-budget-usd }}
        run: |
          set -u
          plugin="$RUNNER_TEMP/ai-consultant"
          budget="${INPUT_BUDGET:-15}"
          domains="${INPUT_DOMAINS:-}"
          [[ "$budget" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::max-budget-usd must be a number"; exit 1; }
          if [ -z "$domains" ]; then
            domains=$(python3 -c "import json,sys;print(', '.join(d['domain'] for d in json.load(open(sys.argv[1]))['domains']))" "$plugin/checklist/checklist.json")
          fi
          [[ "$domains" =~ ^[a-z,\ -]+$ ]] || { echo "::error::domains may only contain lowercase letters, commas, spaces and hyphens"; exit 1; }
          claude -p "Use the ai-consultant:consult skill to audit this project. Nobody is available to answer questions, so run non-interactively: a confirmed profile already exists at .consultant/profile.json (use it unchanged). Audit these domains: ${domains}. Follow the skill exactly, including gathering facts and rendering the report. Finish with a one-line summary of the verdict." \
            --plugin-dir "$plugin" --output-format json --permission-mode acceptEdits \
            --allowedTools "Bash,Read,Grep,Glob,Write,Edit,Agent,Skill" --setting-sources project \
            --no-session-persistence --max-budget-usd "$budget" > "$RUNNER_TEMP/claude.json" 2> "$RUNNER_TEMP/claude.err" || {
              echo "::error::claude exited with an error. The end of its output follows."
              tail -c 1500 "$RUNNER_TEMP/claude.err" || true
              tail -c 1500 "$RUNNER_TEMP/claude.json" || true
              exit 1
            }
          python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print('cost_usd', d.get('total_cost_usd'), 'turns', d.get('num_turns'))" "$RUNNER_TEMP/claude.json"
      - name: Summarise
        if: always()
        run: |
          if [ -f .consultant/REPORT.md ]; then head -c 60000 .consultant/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consultant-report
          path: .consultant/
      - name: Fail when the verdict is NOT READY
        run: python3 "$RUNNER_TEMP/ai-consultant/scripts/render_report.py" --dir .consultant --root . --ci
